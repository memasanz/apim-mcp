[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cli-mcp-server"
version = "0.1.0"
description = "MCP server that exposes curated Azure CLI commands"
requires-python = ">=3.12"
authors = [{ name = "cli-mcp-tool" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "azure-identity>=1.17",
  "azure-storage-blob>=12.20",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "watchfiles>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  "httpx>=0.27",
]

[project.scripts]
cli-mcp-server = "app.main_mcp:run"
cli-mcp-ui = "app.main_ui:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
# B008: FastAPI Depends() in defaults is idiomatic.
# N815: config models intentionally mirror camelCase JSON keys.
ignore = ["S101", "B008", "N815"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
